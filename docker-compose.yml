# ============================================================
# Ultrasound Elastography — Docker Compose Orchestration
# ============================================================
# Services:
#   django  — Gunicorn WSGI app (Phase-1 DMD + CNN-LSTM inference)
#   nginx   — Reverse proxy, static files, large .mat upload handling
#
# Usage:
#   docker-compose up --build -d       # production
#   docker-compose up                  # development (with logs)
#   docker-compose down -v             # tear down (keep volumes: remove -v)
#
# Environment variables:
#   Copy .env.example → .env and fill in secrets before first run.
# ============================================================

version: "3.9"

services:

  # ──────────────────────────────────────────────────────────
  #  Django + Gunicorn — ML Inference Backend
  # ──────────────────────────────────────────────────────────
  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elastography_django
    restart: unless-stopped
    env_file:
      - .env                              # SECRET_KEY, DJANGO_DEBUG, etc.
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DJANGO_SETTINGS_MODULE=core.settings
    volumes:
#      - ./backend:/app                    # live-reload in dev; remove in prod
      - static_volume:/app/static         # shared with nginx for collectstatic
      - media_volume:/app/media           # uploaded .mat files (temp storage)
      - model_weights:/app/ml_engine/weights  # persistent model .pth files
    expose:
      - "8000"                            # only nginx talks to this port
    networks:
      - elastography_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on: []                        # add 'db' here if you add Postgres later

  # ──────────────────────────────────────────────────────────
  #  Nginx — Reverse Proxy & Static / Frontend Server
  # ──────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: elastography_nginx
    restart: unless-stopped
    ports:
      - "80:80"                           # HTTP; swap for 443:443 + SSL in prod
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro   # serve Phase-5 clinical UI
      - static_volume:/app/static:ro          # Django collectstatic output
      - media_volume:/app/media:ro            # uploaded media files
    networks:
      - elastography_net
    depends_on:
      - django

# ──────────────────────────────────────────────────────────────
#  Named Volumes
# ──────────────────────────────────────────────────────────────
volumes:
  static_volume:
  media_volume:
  model_weights:       # persist .pth files across container rebuilds

# ──────────────────────────────────────────────────────────────
#  Internal Network
# ──────────────────────────────────────────────────────────────
networks:
  elastography_net:
    driver: bridge

# ============================================================
# nginx/nginx.conf
# Reverse proxy for Ultrasound Elastography Platform
#
# Responsibilities:
#   1. Serve the Phase-5 clinical frontend (HTML/CSS/JS) from /usr/share/nginx/html
#   2. Forward /api/ requests to the Django + Gunicorn backend container
#   3. Serve Django's collected static files and media uploads directly
#      (bypassing Gunicorn for efficient delivery)
#   4. Handle large .mat file uploads (up to 200 MB) without timeout
#
# Mapped into the container via docker-compose.yml:
#   ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
# ============================================================

# ── Upstream: Django + Gunicorn ───────────────────────────────────────────────
upstream django_backend {
    # Service name from docker-compose.yml; Docker DNS resolves it automatically
    server django:8000;

    # Keep-alive pool: reuse connections to Gunicorn workers for lower latency
    keepalive 16;
}

# ── Main server block (HTTP — port 80) ───────────────────────────────────────
server {
    listen 80;
    server_name _;          # Catch-all: replace with real domain in production
                            # e.g. server_name myserver.example.com;

    # ── Global timeouts (allow long .mat processing) ──────────────────────
    # Django / Gunicorn timeout is 120 s; Nginx must be longer to avoid
    # a 504 Gateway Timeout before Gunicorn finishes the CNN-LSTM forward pass.
    proxy_read_timeout    150s;
    proxy_connect_timeout  10s;
    proxy_send_timeout    150s;

    # ── Upload size limit (must match Django settings + Gunicorn) ─────────
    client_max_body_size 200M;    # largest .mat file the platform accepts

    # ── Gzip compression for JSON/text API responses ──────────────────────
    gzip on;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript;
    gzip_min_length 1024;

    # ── 1. Phase-5 Clinical Frontend (HTML/CSS/JS) ────────────────────────
    # Serve the static single-page application directly from the container FS.
    location / {
        root  /usr/share/nginx/html;
        index index.html;

        # SPA fallback: all unknown paths serve index.html so client-side
        # routing (if added later) doesn't produce 404s.
        try_files $uri $uri/ /index.html;

        # Cache immutable assets (fingerprinted JS/CSS bundles)
        location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── 2. Django REST API ─────────────────────────────────────────────────
    # All requests starting with /api/ are proxied to Gunicorn.
    location /api/ {
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;

        # Required for keep-alive upstream pool
        proxy_set_header   Connection       "";

        # Standard proxy headers so Django can reconstruct the real client IP
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Disable buffering for large streaming or chunked responses.
        # For a REST API returning JSON this is fine; enabling it can increase
        # memory usage for very large Base64 heatmap payloads.
        proxy_buffering    off;
    }

    # ── 3. Django Admin ───────────────────────────────────────────────────
    location /admin/ {
        proxy_pass         http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection       "";
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 4. Django Collected Static Files ─────────────────────────────────
    # Served directly from the shared static_volume Docker volume.
    # This avoids routing static asset requests through Gunicorn.
    location /static/ {
        alias /app/static/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;             # reduce noise in access logs
    }

    # ── 5. Uploaded Media Files (.mat results, strain PNGs) ───────────────
    # Served from the shared media_volume Docker volume.
    # .mat uploads are only stored temporarily; cleanup is handled by views.py.
    location /media/ {
        alias /app/media/;

        # Security: prevent browsers from executing uploaded .mat files
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";

        access_log off;
    }

    # ── 6. Security Headers ───────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── 7. Custom error pages ─────────────────────────────────────────────
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# ── HTTPS (Production) ────────────────────────────────────────────────────────
